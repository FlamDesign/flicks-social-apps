<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad slot preview — The Ordinary "Hair or skin?"</title>
<style>
 body{margin:0;font-family:Georgia,serif;background:#fafafa;color:#222}
 header{padding:18px 24px;border-bottom:1px solid #ddd;font:700 20px "Helvetica Neue",Arial,sans-serif;background:#fff}
 main{max-width:980px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 320px;gap:32px}
 article p{line-height:1.7;color:#444} .ph{height:12px;background:#e6e6e6;border-radius:3px;margin:12px 0}
 aside{display:flex;flex-direction:column;gap:28px}
 .slot{background:#fff;border:1px solid #e3e3e3;padding:10px;width:max-content}
 .slot small{display:block;font:11px "Helvetica Neue",Arial,sans-serif;color:#999;margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
 .inline{margin:28px 0}
 @media(max-width:760px){main{grid-template-columns:1fr}}
</style></head><body>
<header>Daily Journal — preview page (made-up publisher)</header>
<main>
 <article>
  <h1>Five small changes to an evening routine</h1>
  <div class="ph"></div><div class="ph" style="width:92%"></div><div class="ph" style="width:85%"></div>
  <div class="slot inline"><small>Advertisement · 336×280</small><script src="tag.js" data-width="336" data-height="280"></script></div>
  <div class="ph"></div><div class="ph" style="width:90%"></div><div class="ph" style="width:70%"></div>
  <div class="slot inline"><small>Advertisement · 320×480 (mobile)</small><script src="tag.js" data-width="320" data-height="480"></script></div>
  <div class="ph"></div><div class="ph" style="width:88%"></div>
 </article>
 <aside>
  <div class="slot"><small>Advertisement · 300×250</small><script src="tag.js" data-width="300" data-height="250"></script></div>
  <div class="slot"><small>Advertisement · 300×600</small><script src="tag.js" data-width="300" data-height="600"></script></div>
 </aside>
</main></body></html>
