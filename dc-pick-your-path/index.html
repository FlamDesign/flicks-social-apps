<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pick Your Path</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<link rel="preload" as="font" type="font/woff2" href="fonts/plus-jakarta-sans-latin-600-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/anton-latin-400-normal.woff2" crossorigin>
<link rel="preload" as="image" href="media/poster.jpg">
<style>
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 500; font-display: block; src: url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 600; font-display: block; src: url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Anton"; font-weight: 400; font-display: block; src: url(fonts/anton-latin-400-normal.woff2) format("woff2"); }
  :root { --s: min(100vw, 100svh); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #stage { position: relative; width: var(--s); height: var(--s); overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }

  /* intro + loop: plain square videos */
  .sq { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; }
  .sq.on { opacity: 1; }
  /* one video per Flick, its three versions stacked; switching = showing another third (always in sync) */
  .stack { position: absolute; left: 0; top: 0; width: 100%; height: 300%; object-fit: fill; opacity: 0; pointer-events: none; will-change: transform; }
  .stack.on { opacity: 1; }
  #poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #poster.on { display: block; }

  .fade { opacity: 0; pointer-events: none; transition: opacity .28s ease, transform .28s ease; }
  .fade.show { opacity: 1; pointer-events: auto; }

  /* play button: only if the browser refuses autoplay */
  #gate { position: absolute; inset: 0; z-index: 30; display: none; place-items: center; background: #000 url(media/poster.jpg) center/cover no-repeat; cursor: pointer; }
  #gate.on { display: grid; }
  #gate::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.28); }
  #gate .play { position: relative; z-index: 1; width: calc(var(--s) * .15); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9ced8 45%, #8a93a6 100%); box-shadow: 0 6px 30px rgba(0,0,0,.5); display: grid; place-items: center; }
  #gate .play::before { content: ""; margin-left: 8%; border-left: calc(var(--s) * .042) solid #1b1f2a; border-top: calc(var(--s) * .027) solid transparent; border-bottom: calc(var(--s) * .027) solid transparent; }

  /* loop: tap dots + prompt */
  #loopUI { position: absolute; inset: 0; z-index: 10; }
  .hs { position: absolute; transform: translate(-50%, -50%); width: calc(var(--s) * .16); aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; }
  .hs i { position: absolute; left: 50%; top: 50%; width: calc(var(--s) * .05); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
          background: radial-gradient(circle at 38% 32%, #fff 0%, #e4e7ee 22%, #a9b0bf 58%, #6f7789 100%);
          box-shadow: 0 2px 8px rgba(0,0,0,.45), inset 0 -2px 4px rgba(0,0,0,.25), inset 0 2px 3px rgba(255,255,255,.8); }
  .hs i::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); animation: ping 1.8s ease-out infinite; }
  .hs:active i { transform: translate(-50%, -50%) scale(1.2); }
  @keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.3); opacity: 0; } }
  #prompt { position: absolute; left: 11%; top: 80.5%; font-family: Anton, Impact, "Arial Narrow Bold", sans-serif; font-size: calc(var(--s) * .062); line-height: 1.08; letter-spacing: .005em; text-shadow: 0 2px 14px rgba(0,0,0,.55); pointer-events: none; }

  /* Flick: tagline + CTA + version switcher */
  #tray { position: absolute; z-index: 12; right: 6.3%; bottom: 6.2%; display: flex; gap: calc(var(--s) * .014); }
  #tray button { width: calc(var(--s) * .104); aspect-ratio: 1; padding: 0; border-radius: 50%; border: 0; background: #111 center/cover no-repeat; cursor: pointer; box-shadow: 0 6px 22px rgba(0,0,0,.45); transition: transform .15s, box-shadow .15s; }
  #tray button:active { transform: scale(.93); }
  #tray button.cur { box-shadow: 0 0 0 calc(var(--s) * .0045) #fff, 0 6px 22px rgba(0,0,0,.45); }
  #copy { position: absolute; z-index: 12; left: 6.3%; bottom: 6.2%; max-width: 58%; }
  #tag { white-space: pre-line; margin: 0 0 calc(var(--s) * .028); font-weight: 600; font-size: calc(var(--s) * .062); line-height: 1.04; letter-spacing: -.012em; text-shadow: 0 2px 18px rgba(0,0,0,.55); }
  #cta { display: inline-flex; align-items: center; justify-content: center; height: calc(var(--s) * .08); padding: 0 calc(var(--s) * .036); border-radius: 999px; text-decoration: none; color: #fff;
         font-weight: 500; font-size: calc(var(--s) * .04); white-space: nowrap;
         background: linear-gradient(180deg, #a8afc2 0%, #7c849b 55%, #646c84 100%);
         border: calc(var(--s) * .003) solid rgba(255,255,255,.55);
         box-shadow: inset 0 2px 3px rgba(255,255,255,.45), inset 0 -2px 4px rgba(0,0,0,.2), 0 6px 20px rgba(0,0,0,.35); }
  #cta:active { transform: scale(.96); }

  /* controls */
  .ctl { position: absolute; top: 3.5%; z-index: 20; width: calc(var(--s) * .075); max-width: 44px; min-width: 32px; aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; padding: 0; display: grid; place-items: center; cursor: pointer; }
  .ctl svg { width: 52%; height: 52%; }
  #back { left: 3.5%; }
  #mute { right: 3.5%; }

  #spin { position: absolute; left: 50%; top: 50%; z-index: 25; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; animation: rot .8s linear infinite; opacity: 0; transition: opacity .15s; }
  #spin.show { opacity: 1; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="stage">
  <video class="sq" id="intro" playsinline muted preload="auto" src="media/intro.mp4"></video>
  <video class="sq" id="loop" playsinline muted loop preload="auto" src="media/loop.mp4"></video>
  <div id="flicks"></div>
  <img id="poster" alt="">

  <div class="fade" id="loopUI">
    <div id="prompt">TAP TO PICK<br>YOUR PATH</div>
  </div>

  <div class="fade" id="copy"><p id="tag"></p><a id="cta" target="_blank" rel="noopener"></a></div>
  <div class="fade" id="tray"></div>

  <button class="ctl fade" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ctl fade" id="mute" aria-label="Sound"></button>
  <div id="spin"></div>
  <div id="gate" role="button" aria-label="Play"><div class="play"></div></div>
</div>

<script>
/* ---------------- branch map ---------------- */
const FANDANGO = "https://www.fandango.com/";
const MAP = {
  superman: { x: 55.8, y: 37.5, stack: "media/superman_stack.mp4", poster: "media/superman_poster.jpg", versions: [
    { id: "luthercorp", audio: "media/a_luthercorp.m4a", tag: "When power\nmeets purpose.",       cta: "BOOK NOW", url: FANDANGO },
    { id: "pocket",     audio: "media/a_pocket.m4a",     tag: "Hope travels across\ndimensions.", cta: "BOOK NOW", url: FANDANGO },
    { id: "fortress",   audio: "media/a_fortress.m4a",   tag: "Even hope\nfaces the cold.",       cta: "BOOK NOW", url: FANDANGO } ] },
  gl: { x: 27.8, y: 58.4, stack: "media/gl_stack.mp4", poster: "media/gl_poster.jpg", versions: [
    { id: "gl_green", audio: "media/a_gl.m4a", tag: "Wear the\npower of will.",    cta: "SHOP NOW", url: "https://shop.dc.com/products/lanterns-hoodie-in-brightest-day-in-blackest-night" },
    { id: "gl_blue",  audio: "media/a_gl.m4a", tag: "Wear a symbol\nof hope.",     cta: "SHOP NOW", url: "https://shop.dc.com/products/superman-2025-movie-s-shield-hoodie?_pos=3&_sid=7dd19ad99&_ss=r" },
    { id: "gl_red",   audio: "media/a_gl.m4a", tag: "Little lightning\ngoes far.", cta: "SHOP NOW", url: "https://shop.dc.com/products/the-flash-versus-embroidered-hoodie?_pos=2&_sid=ed523e33c&_ss=r" } ] },
  lois: { x: 69.5, y: 69.1, stack: "media/lois_stack.mp4", poster: "media/lois_poster.jpg", versions: [
    { id: "master",   audio: "media/a_lois.m4a",     tag: "Not every suit\nsaves lives.",     cta: "BOOK NOW", url: FANDANGO },
    { id: "bounty",   audio: "media/a_lois.m4a",     tag: "Hope comes\nwith a price.",        cta: "BOOK NOW", url: FANDANGO },
    { id: "evidence", audio: "media/a_evidence.m4a", tag: "The truth cannot\nstay hidden.",   cta: "BOOK NOW", url: FANDANGO } ] }
};
for (const h of Object.values(MAP)) for (const v of h.versions) v.thumb = `media/th_${v.id}.webp`;

/* ---------------- player ---------------- */
const $ = id => document.getElementById(id);
const intro = $("intro"), loopV = $("loop"), poster = $("poster"), spin = $("spin"), gate = $("gate");
let state = "intro", hero = null, ver = 0, vid = null, muted = true, audio = null;
const stacks = {}, audios = {};
const ICON_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';

/* thumbnails + Flick posters are tiny: preload them. Flick videos load only when their hero is tapped. */
for (const h of Object.values(MAP)) { new Image().src = h.poster; h.versions.forEach(v => new Image().src = v.thumb); }

const playOr = (el) => el.play().catch(() => gate.classList.add("on"));
const ready = v => v.readyState >= 3 ? Promise.resolve() : new Promise(r => v.addEventListener("canplay", r, { once: true }));

function ui() {
  const on = (id, b) => $(id).classList.toggle("show", b);
  on("loopUI", state === "loop");
  on("copy", state === "flick");
  on("tray", state === "flick");
  on("back", state === "flick");
  on("mute", true);
}
function show(el) {             // put one picture on top, hide the rest
  [intro, loopV, ...Object.values(stacks)].forEach(x => { if (x !== el) { x.classList.remove("on"); } });
  el.classList.add("on");
}

/* intro -> loop */
intro.addEventListener("ended", toLoop);
function toLoop() {
  leaveFlick();
  state = "loop"; hero = null;
  loopV.currentTime = 0; playOr(loopV);
  const swap = () => { show(loopV); intro.pause(); };
  loopV.requestVideoFrameCallback ? loopV.requestVideoFrameCallback(swap) : loopV.addEventListener("playing", swap, { once: true });
  ui();
}

/* loop -> Flick: tap a hero and its Flick starts straight away */
function stackFor(id) {
  if (stacks[id]) return stacks[id];
  const v = document.createElement("video");
  v.className = "stack"; v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.loop = true; v.preload = "auto";
  v.src = MAP[id].stack;               // fetched here, on tap only
  $("flicks").appendChild(v); return (stacks[id] = v);
}
function audioFor(src) {
  if (audios[src]) return audios[src];
  const a = new Audio(src); a.loop = true; a.preload = "auto"; return (audios[src] = a);
}
async function enterFlick(id) {
  hero = id; ver = 0; state = "flick";
  const h = MAP[id];
  buildTray(h); setVersion(0, false);
  ui();
  vid = stackFor(id);
  if (vid.readyState < 3) { poster.src = h.poster; poster.classList.add("on"); spin.classList.add("show"); }
  vid.currentTime = 0;
  const p = vid.play();
  // sound: start this version's track inside the tap, so phones allow it
  syncAudio(true);
  if (p) p.catch(() => gate.classList.add("on"));
  await ready(vid);
  if (hero !== id) return;
  const swap = () => { if (hero !== id) return; show(vid); poster.classList.remove("on"); spin.classList.remove("show"); loopV.pause(); };
  vid.requestVideoFrameCallback ? vid.requestVideoFrameCallback(swap) : swap();
}
function leaveFlick() {
  if (vid) { vid.pause(); vid.classList.remove("on"); }
  if (audio) audio.pause();
  vid = null; audio = null;
  poster.classList.remove("on"); spin.classList.remove("show");
}

function buildTray(h) {
  const tray = $("tray"); tray.innerHTML = "";
  h.versions.forEach((v, i) => {
    const b = document.createElement("button");
    b.style.backgroundImage = `url("${v.thumb}")`; b.setAttribute("aria-label", v.tag.replace("\n", " ")); b.dataset.id = v.id;
    b.onclick = () => setVersion(i, true);
    tray.appendChild(b);
  });
}
/* switching never restarts anything: same video, same frame, another third */
function setVersion(i, fromTap) {
  ver = i; const v = MAP[hero].versions[i];
  stackFor(hero).style.transform = `translateY(${-i * 100 / 3}%)`;
  [...$("tray").children].forEach((b, k) => b.classList.toggle("cur", k === i));
  $("tag").textContent = v.tag; $("cta").textContent = v.cta; $("cta").href = v.url;
  if (fromTap) syncAudio(true);
}

/* each version's soundtrack runs alongside the Flick video, locked to its clock */
function syncAudio(force) {
  if (state !== "flick" || !vid) return;
  const want = muted ? null : audioFor(MAP[hero].versions[ver].audio);
  if (audio && audio !== want) audio.pause();
  audio = want;
  if (!audio) return;
  const t = vid.currentTime % (vid.duration || 1e9);
  if (force || Math.abs(audio.currentTime - t) > 0.12) { try { audio.currentTime = t; } catch (e) {} }
  if (vid.paused) { audio.pause(); return; }
  if (audio.paused) audio.play().catch(() => {});
}
setInterval(() => syncAudio(false), 250);

function syncMute() {
  $("mute").innerHTML = muted ? ICON_OFF : ICON_ON;
  intro.muted = muted;                 // the intro has sound; the loop has none
  syncAudio(true);
}
$("mute").onclick = () => { muted = !muted; syncMute(); };
$("back").onclick = toLoop;

/* tap dots */
for (const [id, h] of Object.entries(MAP)) {
  const b = document.createElement("button");
  b.className = "hs"; b.style.left = h.x + "%"; b.style.top = h.y + "%"; b.setAttribute("aria-label", id);
  b.innerHTML = "<i></i>";
  b.onclick = () => enterFlick(id);
  $("loopUI").appendChild(b);
}

/* resume after the tab/app comes back; play button only if the browser refuses */
gate.onclick = () => {
  gate.classList.remove("on");
  const el = state === "intro" ? intro : state === "loop" ? loopV : vid;
  if (el) el.play().then(() => syncAudio(true)).catch(() => {});
  if (state === "intro" && !intro.classList.contains("on")) show(intro);
};
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { if (audio) audio.pause(); return; }
  const el = state === "intro" ? (intro.ended ? null : intro) : state === "loop" ? loopV : vid;
  if (el && el.paused) el.play().then(() => syncAudio(true)).catch(() => gate.classList.add("on"));
});

/* autoplay muted on load, like The Ordinary */
syncMute(); ui();
intro.play().then(() => show(intro)).catch(() => gate.classList.add("on"));
</script>
</body>
</html>
